name: NBA Edges

on:
  schedule:
    - cron: "0 15 * 10-12,1-6 *"                 # morning slate scan (11 AM ET), Oct–June
    - cron: "*/30 16-23,0-4 * 10-12,1-6 *"       # pregame checks every 30 min, noon – 12:30 AM ET
  workflow_dispatch:
    inputs:
      mode:
        description: "morning or pregame"
        default: morning
      dry_run:
        description: "1 = print instead of sending"
        default: "0"
      date:
        description: "optional YYYY-MM-DD to test a past slate"
        default: ""

concurrency:
  group: nba-edges
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: nba-edges/.cache
          key: nba-cache-${{ github.run_id }}
          restore-keys: nba-cache-
      - name: Run scan
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 15 * 10-12,1-6 *' && 'morning' || 'pregame') }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          DATE: ${{ github.event.inputs.date }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node nba-edges/run.js

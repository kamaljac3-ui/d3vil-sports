name: CFB Lines

on:
  schedule:
    # Every 15 min, 12:00-05:59 UTC (8 AM-1:59 AM ET), Aug-Jan. The script decides what's due from
    # Eastern time via Intl, so the Nov 1 DST change needs no cron edit, and it exits fast otherwise.
    - cron: "7,22,37,52 12-23,0-5 * 8-12,1 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, backtest, auto, first, update, final, gameday, or review (weekly scorecard now)"
        default: probe
      dry_run:
        description: "1 = print instead of sending (and mark nothing as sent)"
        default: "1"

permissions:
  contents: write   # the weekly review pushes its ledger to the bot-results branch (not main: no Pages deploy)

concurrency:
  group: cfb-lines
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a full backtest with the adjustment tests runs ~35 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: cfb-lines/.cache
          key: cfb-state-${{ github.run_id }}
          restore-keys: cfb-state-
      - name: Run
        id: run
        env:
          NP_CACHE: cfb-lines/.cache
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_MONTHLY_BUDGET: ${{ vars.CFB_CFBD_BUDGET || '700' }}
          # its own topic, separate from the baseball/NBA/NFL alerts
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_CFB }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          MIN_SPREAD: ${{ vars.CFB_MIN_SPREAD }}
          MIN_TOTAL: ${{ vars.CFB_MIN_TOTAL }}
          SPREAD_EDGES: ${{ vars.CFB_SPREAD_EDGES }}
          TOTAL_EDGES: ${{ vars.CFB_TOTAL_EDGES }}
          MAX_EDGE: ${{ vars.CFB_MAX_EDGE }}
          MIN_WEEK: ${{ vars.CFB_MIN_WEEK }}
          FIRST_HOUR: ${{ vars.CFB_FIRST_HOUR }}
          UPDATE_HOUR: ${{ vars.CFB_UPDATE_HOUR }}
          FINAL_HOUR: ${{ vars.CFB_FINAL_HOUR }}
          GD_MIN: ${{ vars.CFB_GD_MIN }}
          GD_MAX: ${{ vars.CFB_GD_MAX }}
        run: |
          if [ "$MODE" = "backtest" ]; then
            node cfb-lines/backtest.js
          elif [ "$MODE" = "review" ]; then
            echo "review mode: see the Weekly review step"
          else
            node cfb-lines/run.js
          fi
      # The weekly learning loop (cfb-lines/review.js): Monday from 8 AM ET, Tuesday as a backup, or mode=review.
      # Grades every logged pick, keeps the ledger on the bot-results branch (cfb/) and sends one scorecard per week
      # (cfb/scorecards.json dedupes it). It runs inside this job, not its own workflow, so its few CFBD calls are
      # counted in the saved state and it never races the bot's cache.
      - name: Check out ledger (bot-results branch)
        id: ledger
        if: ${{ !cancelled() && (github.event.inputs.mode == 'review' || (github.event.inputs.mode || 'auto') == 'auto') }}
        run: |
          d=$(TZ=America/New_York date +%a)
          if [ "${{ github.event.inputs.mode }}" != "review" ] && [ "$d" != "Mon" ] && [ "$d" != "Tue" ]; then exit 0; fi
          if git ls-remote --exit-code --heads origin bot-results >/dev/null; then
            git fetch -q origin bot-results:bot-results
            git worktree add -q ledger bot-results
          else
            git worktree add -q --orphan -b bot-results ledger
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Weekly review
        id: review
        if: ${{ !cancelled() && steps.ledger.outputs.ready == 'true' }}
        env:
          NP_CACHE: cfb-lines/.cache
          LEDGER_DIR: ledger
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE_SEND: ${{ github.event.inputs.mode == 'review' && '1' || '0' }}   # a manual review always sends
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_MONTHLY_BUDGET: ${{ vars.CFB_CFBD_BUDGET || '700' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_CFB }}   # CFB's own topic, no fallback
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: node cfb-lines/review.js
      - name: Save ledger
        if: ${{ !cancelled() && steps.review.outcome == 'success' && (github.event.inputs.dry_run || '0') != '1' }}
        working-directory: ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -q -m "cfb review: $(TZ=America/New_York date +%F)"
          # the results tracker and the NFL review push to this branch too: rebase onto it and retry if it moved
          for i in 1 2 3; do git push -q origin bot-results && exit 0; git pull -q --rebase origin bot-results; done
          exit 1
      - name: Upload backtest results
        if: github.event.inputs.mode == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: cfb-backtest
          path: |
            cfb-lines/params.json
            cfb-lines/.cache/backtest.md
      - name: Save state
        if: always() && (steps.run.outputs.state_changed == 'true' || steps.review.outputs.state_changed == 'true')
        uses: actions/cache/save@v4
        with:
          path: cfb-lines/.cache
          key: cfb-state-${{ github.run_id }}

name: Deploy D3vil Sports to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  newsletter:
    # Only ever fires on a real push to main — never on a manual
    # workflow_dispatch re-run. The "detect newly added post" step has no
    # memory of whether a broadcast was already sent for that post, so
    # re-running this job manually on the same commit re-sends a brand new
    # broadcast to every subscriber each time. Manual re-runs are for
    # testing the deploy job only; test the newsletter HTML locally with
    # `node -e "require('./scripts/send-newsletter.js').buildEmailHtml(...)"`
    # instead, which never touches the live Kit API.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect newly added post
        id: detect
        run: |
          NEW_POST=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'posts/*.html' | grep -v '^posts/latest.html$' | head -n1)
          if [ -z "$NEW_POST" ]; then
            echo "No new post in this push — skipping newsletter send."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "New post detected: $NEW_POST"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$NEW_POST" >> "$GITHUB_OUTPUT"
          fi

      - name: Send newsletter
        if: steps.detect.outputs.found == 'true'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          POST_FILE: ${{ steps.detect.outputs.file }}
        run: node scripts/send-newsletter.js

  recap:
    # Weekly 7-day audio recap. Only fires on a real push (same
    # duplicate-prevention reasoning as the newsletter job above), only on
    # Sundays, and only when that push actually added a new daily post —
    # otherwise a mid-week fix pushed on a Sunday would trigger it too.
    # Needs contents:write (unlike the other jobs) since it commits the
    # generated audio file and updated homepage back to the repo — and
    # because it commits using the default GITHUB_TOKEN, that push does
    # NOT trigger a new workflow run (GitHub deliberately blocks
    # GITHUB_TOKEN-authored pushes from re-triggering workflows, to
    # prevent infinite loops). That means the normal `deploy` job never
    # sees this commit, so this job also deploys Pages itself at the end
    # rather than relying on a second run — hence pages/id-token perms
    # and its own environment block, mirroring the `deploy` job above.
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect recap day
        id: detect
        run: |
          DOW=$(date -u +%u)
          NEW_POST=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'posts/*.html' | grep -v '^posts/latest.html$' | head -n1)
          if [ "$DOW" != "7" ]; then
            echo "Not Sunday (day $DOW) — skipping recap."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$NEW_POST" ]; then
            echo "No new post in this push — skipping recap."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sunday and a new post landed — generating recap."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate recap audio
        if: steps.detect.outputs.run == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-recap-audio.js

      - name: Commit and push recap
        if: steps.detect.outputs.run == 'true'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add audio/ index.html
          git commit -m "Add weekly audio recap" -m "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git push

      # This job's own push above won't trigger the `deploy` job (see note
      # on the job itself), so deploy the updated site directly here —
      # the working tree already has the just-committed changes since we
      # never re-checked-out after committing. `needs: deploy` above plus
      # a distinct artifact name here are both required: without them,
      # this job's own upload-pages-artifact collides with the `deploy`
      # job's identically-named "github-pages" artifact from the same
      # workflow run, and deploy-pages fails with "Multiple artifacts
      # named github-pages were unexpectedly found" — this happened for
      # real on the first true unattended Sunday run (2026-09-13): the
      # commit landed fine, but this step failed, so the live site kept
      # serving the prior week's recap with no visible error anywhere
      # except this job's own red X.
      - name: Upload artifact
        if: steps.detect.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: recap-pages

      - name: Setup Pages
        if: steps.detect.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        if: steps.detect.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: recap-pages

name: NFL Lines

on:
  schedule:
    # Every 2 hours, each run staying up to 5 h and waking for each alert window (LOOP_MIN), exiting early
    # when nothing is due before it would end. Every window is covered by at least two runs, because GitHub
    # skips frequent crons on busy days: on Sep 27, 2026 a 15-minute cron ran ~every 3 h and missed 3 of 4
    # game-day windows. Eastern time is handled in the script, so DST needs no cron changes.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, slate (force the next kickoff slot now), backtest, or test (send one test alert)"
        default: slate
      dry_run:
        description: "1 = print instead of sending (and mark nothing as sent)"
        default: "1"

concurrency:
  group: nfl-lines
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: nfl-lines/.cache
          key: nl-state-${{ github.run_id }}
          restore-keys: nl-state-
      - name: Run
        id: run
        env:
          NP_CACHE: nfl-lines/.cache
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          LOOP_MIN: ${{ github.event_name == 'schedule' && '300' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_NFL || secrets.NTFY_TOPIC }}   # NFL feed; falls back to the shared topic until NTFY_TOPIC_NFL exists
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MONTHLY_BUDGET: ${{ vars.NL_ODDS_MONTHLY_BUDGET || '100' }}
          LINES: ${{ vars.NL_LINES }}
          MIN_SPREAD: ${{ vars.NL_MIN_SPREAD }}
          MIN_ML: ${{ vars.NL_MIN_ML }}
          MIN_TOTAL: ${{ vars.NL_MIN_TOTAL }}
          TOTAL_EDGES: ${{ vars.NL_TOTAL_EDGES }}
          MIN_WEEK: ${{ vars.NL_MIN_WEEK }}
          GD_MIN: ${{ vars.NL_GD_MIN }}
          GD_MAX: ${{ vars.NL_GD_MAX }}
          RATING: ${{ vars.NL_RATING }}
          MIN_EV_LINES: ${{ vars.NL_MIN_EV_LINES }}
          # which books to check for stale prices, and the sharp reference (the-odds-api bookmaker keys)
          MY_BOOKS: ${{ vars.MY_BOOKS }}
          ODDS_SHARP: ${{ vars.ODDS_SHARP }}
        run: |
          if [ "$MODE" = "backtest" ]; then
            for y in 2023 2024 2025; do BT_SEASON=$y node nfl-lines/backtest.js; done
          else
            node nfl-lines/run.js
          fi
      - name: Save state
        if: always() && steps.run.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: nfl-lines/.cache
          key: nl-state-${{ github.run_id }}

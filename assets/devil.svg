<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Full Slate devil mascot (bust): black base, reddish-maroon undertones/accents -->

  <!-- horns -->
  <path d="M128 90 C 138 68, 156 54, 166 36 C 170 50, 162 68, 146 84
           C 140 90, 134 92, 128 90 Z" fill="#7a2a1c"/>
  <path d="M72 90 C 62 68, 44 54, 34 36 C 30 50, 38 68, 54 84
           C 60 90, 66 92, 72 90 Z" fill="#7a2a1c"/>

  <!-- ears: bigger, pointed, sticking out to the sides -->
  <path d="M34 100 C 14 90, 4 108, 12 130 C 23 127, 35 114, 34 100 Z" fill="#7a2a1c"/>
  <path d="M166 100 C 186 90, 196 108, 188 130 C 177 127, 165 114, 166 100 Z" fill="#7a2a1c"/>

  <!-- head -->
  <path d="M100 48
           C 146 48, 168 80, 162 116
           C 158 146, 134 172, 100 176
           C 66 172, 42 146, 38 116
           C 32 80, 54 48, 100 48 Z" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- widow's peak -->
  <path d="M86 54 L100 72 L114 54 C 108 50, 92 50, 86 54 Z" fill="#7a2a1c"/>

  <!-- brow / eyes -->

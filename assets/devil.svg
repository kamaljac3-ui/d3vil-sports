<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Full Slate devil mascot: black base, reddish-maroon undertones/accents -->

  <!-- horns: short hooked spikes angled out from the temple, curling back -->
  <path d="M128 90 C 138 68, 156 54, 166 36 C 170 50, 162 68, 146 84
           C 140 90, 134 92, 128 90 Z" fill="#7a2a1c"/>
  <path d="M72 90 C 62 68, 44 54, 34 36 C 30 50, 38 68, 54 84
           C 60 90, 66 92, 72 90 Z" fill="#7a2a1c"/>

  <!-- ears: small maroon accents tucked at the horn base -->
  <path d="M42 88 C 30 84, 24 96, 32 106 C 40 102, 44 94, 42 88 Z" fill="#7a2a1c"/>
  <path d="M158 88 C 170 84, 176 96, 168 106 C 160 102, 156 94, 158 88 Z" fill="#7a2a1c"/>

  <!-- head -->
  <path d="M100 48
           C 146 48, 168 80, 162 116
           C 158 146, 134 172, 100 176
           C 66 172, 42 146, 38 116
           C 32 80, 54 48, 100 48 Z" fill="#171210"/>

  <!-- widow's peak -->
  <path d="M86 54 L100 72 L114 54 C 108 50, 92 50, 86 54 Z" fill="#7a2a1c"/>

  <!-- brow / eyes -->
  <path d="M58 104 L74 90 L92 100" stroke="#eef1f5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108 100 L126 90 L142 104" stroke="#eef1f5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="111" r="6" fill="#7a2a1c"/>
  <circle cx="124" cy="111" r="6" fill="#7a2a1c"/>

  <!-- big wide grin (Wahoo-style toothy smile), maroon interior, white tooth band, corner fangs -->
  <path d="M58 128 Q100 122 142 128 Q140 158 100 158 Q60 158 58 128 Z" fill="#7a2a1c"/>
  <path d="M64 130 Q100 126 136 130 Q134 139 100 141 Q66 139 64 130 Z" fill="#eef1f5"/>
  <path d="M80 131 L79 138" stroke="#171210" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M90 132 L89 139" stroke="#171210" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 132 L100 140" stroke="#171210" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M110 132 L111 139" stroke="#171210" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M120 131 L121 138" stroke="#171210" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70 131 L62 129 L67 148 Z" fill="#eef1f5"/>
  <path d="M130 131 L138 129 L133 148 Z" fill="#eef1f5"/>

  <!-- goatee -->
  <path d="M92 159 C 96 173, 104 173, 108 159 C 102 165, 98 165, 92 159 Z" fill="#7a2a1c"/>

  <!-- shoulders + crossed-arms suggestion -->
  <path d="M26 220 C 28 184, 58 166, 100 166 C 142 166, 172 184, 174 220 Z" fill="#171210"/>
  <path d="M56 192 C 70 210, 92 216, 100 202 C 108 216, 130 210, 144 192
           C 138 208, 118 220, 100 220 C 82 220, 62 208, 56 192 Z" fill="#7a2a1c"/>

  <!-- glossy sticker sheen -->
  <ellipse cx="78" cy="82" rx="30" ry="20" fill="#ffffff" opacity="0.08"/>
</svg>

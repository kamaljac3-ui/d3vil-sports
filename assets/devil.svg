  <path d="M108 100 L126 90 L142 104" stroke="#eef1f5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="111" r="6" fill="#7a2a1c"/>
  <circle cx="124" cy="111" r="6" fill="#7a2a1c"/>

  <!-- nose -->
  <path d="M96 113 L104 113 L100 120 Z" fill="#7a2a1c"/>

  <!-- big grin, both tooth rows showing -->
  <path d="M58 128 Q100 122 142 128 Q140 158 100 158 Q60 158 58 128 Z" fill="#7a2a1c"/>
  <path d="M66 129 L78 128 L70 144 Z" fill="#eef1f5"/>
  <path d="M82 128 L92 127 L86 140 Z" fill="#eef1f5"/>
  <path d="M96 127 L106 127 L101 142 Z" fill="#eef1f5"/>
  <path d="M110 127 L120 128 L115 140 Z" fill="#eef1f5"/>
  <path d="M124 128 L136 129 L130 144 Z" fill="#eef1f5"/>
  <path d="M68 154 L80 155 L73 141 Z" fill="#eef1f5"/>
  <path d="M84 155 L94 155 L89 143 Z" fill="#eef1f5"/>
  <path d="M98 156 L108 156 L103 142 Z" fill="#eef1f5"/>
  <path d="M112 155 L122 155 L117 143 Z" fill="#eef1f5"/>
  <path d="M126 155 L138 154 L131 141 Z" fill="#eef1f5"/>

  <!-- goatee -->
  <path d="M92 159 C 96 173, 104 173, 108 159 C 102 165, 98 165, 92 159 Z" fill="#7a2a1c"/>

  <!-- shoulders + crossed-arms suggestion -->
  <path d="M26 220 C 28 184, 58 166, 100 166 C 142 166, 172 184, 174 220 Z" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M56 192 C 70 210, 92 216, 100 202 C 108 216, 130 210, 144 192
           C 138 208, 118 220, 100 220 C 82 220, 62 208, 56 192 Z" fill="#7a2a1c"/>

  <!-- glossy sticker sheen -->

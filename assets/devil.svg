<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Full Slate devil mascot: original design, no pitchfork, arms-crossed pose -->

  <!-- horns: short hooked spikes angled out from the temple, curling back
       (angled + curled reads as "horn"; tall + vertical reads as "ear") -->
  <path d="M128 90 C 138 68, 156 54, 166 36 C 170 50, 162 68, 146 84
           C 140 90, 134 92, 128 90 Z" fill="#0d0f12"/>
  <path d="M72 90 C 62 68, 44 54, 34 36 C 30 50, 38 68, 54 84
           C 60 90, 66 92, 72 90 Z" fill="#0d0f12"/>

  <!-- head -->
  <path d="M100 48
           C 146 48, 168 80, 162 116
           C 158 146, 134 172, 100 176
           C 66 172, 42 146, 38 116
           C 32 80, 54 48, 100 48 Z" fill="#14171c"/>

  <!-- widow's peak -->
  <path d="M86 54 L100 72 L114 54 C 108 50, 92 50, 86 54 Z" fill="#0d0f12"/>

  <!-- brow / sly eyes -->
  <path d="M58 104 L74 90 L92 100" stroke="#eef1f5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108 100 L126 90 L142 104" stroke="#eef1f5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="111" r="6" fill="#ff5a3c"/>
  <circle cx="124" cy="111" r="6" fill="#ff5a3c"/>

  <!-- smirk with a fang on each side -->
  <path d="M64 133 C 82 151, 118 151, 140 129 C 128 149, 100 157, 78 149 C 70 146, 66 140, 64 133 Z" fill="#0d0f12"/>
  <path d="M119 134 L129 130 L123 143 Z" fill="#eef1f5"/>
  <path d="M81 135 L71 131 L77 144 Z" fill="#eef1f5"/>

  <!-- goatee -->
  <path d="M92 159 C 96 173, 104 173, 108 159 C 102 165, 98 165, 92 159 Z" fill="#0d0f12"/>

  <!-- shoulders + crossed-arms suggestion -->
  <path d="M26 220 C 28 184, 58 166, 100 166 C 142 166, 172 184, 174 220 Z" fill="#14171c"/>
  <path d="M56 192 C 70 210, 92 216, 100 202 C 108 216, 130 210, 144 192
           C 138 208, 118 220, 100 220 C 82 220, 62 208, 56 192 Z" fill="#0d0f12"/>

  <!-- glossy sticker sheen -->
  <ellipse cx="78" cy="82" rx="30" ry="20" fill="#ffffff" opacity="0.1"/>
</svg>

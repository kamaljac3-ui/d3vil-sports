  <!-- widow's peak (maroon accent) -->
  <path d="M136 62 L150 80 L164 62 C 158 58, 142 58, 136 62 Z" fill="#7a2a1c"/>

  <!-- brow / eyes -->
  <path d="M108 112 L124 98 L142 108" stroke="#eef1f5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M158 108 L176 98 L192 112" stroke="#eef1f5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="126" cy="119" r="6" fill="#7a2a1c"/>
  <circle cx="174" cy="119" r="6" fill="#7a2a1c"/>

  <!-- nose (maroon accent) -->
  <path d="M146 121 L154 121 L150 128 Z" fill="#7a2a1c"/>

  <!-- big grin, BOTH tooth rows showing -->
  <path d="M108 136 Q150 130 192 136 Q190 166 150 166 Q110 166 108 136 Z" fill="#7a2a1c"/>
  <path d="M116 137 L128 136 L120 152 Z" fill="#eef1f5"/>
  <path d="M132 136 L142 135 L136 148 Z" fill="#eef1f5"/>
  <path d="M146 135 L156 135 L151 150 Z" fill="#eef1f5"/>
  <path d="M160 135 L170 136 L165 148 Z" fill="#eef1f5"/>
  <path d="M174 136 L186 137 L180 152 Z" fill="#eef1f5"/>
  <path d="M118 162 L130 163 L123 149 Z" fill="#eef1f5"/>
  <path d="M134 163 L144 163 L139 151 Z" fill="#eef1f5"/>
  <path d="M148 164 L158 164 L153 150 Z" fill="#eef1f5"/>
  <path d="M162 163 L172 163 L167 151 Z" fill="#eef1f5"/>
  <path d="M176 163 L188 162 L181 149 Z" fill="#eef1f5"/>

  <!-- goatee (maroon accent) -->
  <path d="M142 167 C 146 181, 154 181, 158 167 C 152 173, 148 173, 142 167 Z" fill="#7a2a1c"/>

  <!-- glossy sticker sheen -->
  <ellipse cx="128" cy="82" rx="30" ry="20" fill="#ffffff" opacity="0.08"/>
  <ellipse cx="122" cy="212" rx="30" ry="20" fill="#ffffff" opacity="0.06"/>
</svg>

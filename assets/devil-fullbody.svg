<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Full Slate devil mascot — full body, standing pose with legs.
       Black base, reddish-maroon undertones/accents throughout.
       Right hand raised holding a flame (no pitchfork). -->

  <!-- tail (maroon accent) -->
  <path d="M172 235 C 192 242, 206 232, 210 214 C 212 204, 206 200, 201 205
           C 199 216, 190 226, 175 228 Z" fill="#7a2a1c"/>
  <path d="M206 206 L219 199 L213 215 Z" fill="#7a2a1c"/>

  <!-- legs -->
  <path d="M122 246 C 118 260, 118 276, 123 290 L141 290 C 139 274, 137 258, 139 246 Z" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M178 246 C 182 260, 182 276, 177 290 L159 290 C 161 274, 163 258, 161 246 Z" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="132" cy="291" rx="15" ry="7" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="168" cy="291" rx="15" ry="7" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- left arm, resting at side -->
  <path d="M110 196 C 94 202, 85 220, 90 240 C 93 248, 100 250, 106 246
           C 108 230, 106 212, 116 199 Z" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="96" cy="243" r="11" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- torso -->
  <path d="M108 200 C 108 186, 126 180, 150 180 C 174 180, 192 186, 192 200
           C 196 222, 190 244, 150 250 C 110 244, 104 222, 108 200 Z" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M132 210 C 140 220, 160 220, 168 210" stroke="#7a2a1c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- right arm, raised -->
  <path d="M188 196 C 205 193, 218 173, 222 143 C 224 118, 227 94, 230 71
           C 236 77, 237 94, 235 117 C 233 144, 227 174, 206 204 Z" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="232" cy="67" r="13" fill="#171210" stroke="#7a2a1c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- flame in raised hand -->
  <path d="M232 14 C 245 30, 249 46, 232 56 C 215 46, 219 30, 232 14 Z" fill="#ff5a3c"/>
  <path d="M232 28 C 239 37, 241 45, 232 50 C 223 45, 225 37, 232 28 Z" fill="#ffcf66"/>

  <!-- horns (maroon accent) -->
  <path d="M178 98 C 188 76, 206 62, 216 44 C 220 58, 212 76, 196 92
           C 190 98, 184 100, 178 98 Z" fill="#7a2a1c"/>
  <path d="M122 98 C 112 76, 94 62, 84 44 C 80 58, 88 76, 104 92
           C 110 98, 116 100, 122 98 Z" fill="#7a2a1c"/>

  <!-- ears: bigger, pointed, sticking out to the sides (maroon accent) -->
  <path d="M84 108 C 64 98, 54 116, 62 138 C 73 135, 85 122, 84 108 Z" fill="#7a2a1c"/>
  <path d="M216 108 C 236 98, 246 116, 238 138 C 227 135, 215 122, 216 108 Z" fill="#7a2a1c"/>

  <!-- head -->
  <path d="M150 56 C 196 56, 218 88, 212 124 C 208 154, 184 180, 150 184
